<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f5f3" />
    <meta name="description" content="PipMint — Custom Card Creator" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/pipmint_favicon_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/pipmint_favicon_16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>PipMint · Custom Card Creator</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pipmint-appearance-theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          var root = document.documentElement
          root.setAttribute('data-theme', t)
          root.classList.toggle('dark', t === 'dark')
          root.style.colorScheme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'light' ? '#f2f5f3' : '#0a0c0e')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <style>
      html { font-family: "SF Pro Text", "Segoe UI Variable", "IBM Plex Sans", system-ui, sans-serif; }
      html, body { background: #f2f5f3; color: #1a2220; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0a0c0e; color: #f2f4f5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
